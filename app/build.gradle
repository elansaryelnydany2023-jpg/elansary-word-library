plugins { id 'com.android.application' }
android {
 namespace 'com.elansary.wordlibrary'
 compileSdk 35
 defaultConfig { applicationId 'com.elansary.wordlibrary'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1-tree-preview' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/NOTICE','META-INF/LICENSE.txt','META-INF/NOTICE.txt'] } }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'org.apache.poi:poi-scratchpad:5.2.5'
}
